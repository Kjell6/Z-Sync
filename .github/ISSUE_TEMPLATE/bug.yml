name: Bug
description: Something is broken or behaves wrong
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Both
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      description: You can find it in Settings → About.
      placeholder: e.g. 1.6 (12)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: What do you do, what should happen, and what happens instead?
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recordings
      description: Optional. Drag images or videos here. No Mozilla passwords or session tokens.
