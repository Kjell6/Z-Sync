name: Feature request
description: Suggest something the apps should do
title: "[Feature request]: "
labels: [enhancement]
body:
  - type: checkboxes
    id: before
    attributes:
      label: Before requesting
      options:
        - label: I searched open and closed issues for this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and where in the app.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like instead.
    validations:
      required: true
