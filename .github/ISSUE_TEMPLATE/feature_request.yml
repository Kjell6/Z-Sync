name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: checkboxes
    id: before
    attributes:
      label: Before requesting
      options:
        - label: I searched open and closed issues for this request.
          required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Z-Sync to do? A few sentences are enough — and feel free to say what you need it for.
    validations:
      required: true
