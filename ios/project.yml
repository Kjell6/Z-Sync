name: ZenCompanion
options:
  bundleIdPrefix: de.kjell
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  ZenCompanion:
    type: application
    platform: iOS
    sources:
      - path: ZenCompanion
        excludes:
          - "PrivacyInfo.xcprivacy"
      - path: Shared
      - path: ZenCompanion/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: AppIcon.icon
        buildPhase: resources
    info:
      path: ZenCompanion/Info.plist
      properties:
        CFBundleDisplayName: Z-Sync
        CFBundleName: Z-Sync
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CFBundleDevelopmentRegion: en
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: ZenCompanion/ZenCompanion.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.kjell.zencompanion
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.kjell.zencompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kjell.zencompanion
        INFOPLIST_FILE: ZenCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: ZenCompanion/ZenCompanion.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShareExtension
        embed: true
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - "PrivacyInfo.xcprivacy"
      - path: Shared
      - path: ZenCompanion/Assets.xcassets
        excludes:
          - "AppIcon.appiconset"
      - path: ShareExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Z-Sync
        CFBundleName: Z-Sync
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.kjell.zencompanion
        keychain-access-groups:
          - $(AppIdentifierPrefix)de.kjell.zencompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kjell.zencompanion.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "8"
        SKIP_INSTALL: true
  ZenCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZenCompanionTests
      - path: Shared
      # Leaf dirs so JSON lands at the test-bundle root (loaders use basename).
      - path: ../shared/contract/fixtures/crypto
        name: ContractFixturesCrypto
        buildPhase: resources
      - path: ../shared/contract/fixtures/wire
        name: ContractFixturesWire
        buildPhase: resources
      - path: ../shared/contract/fixtures/auth
        name: ContractFixturesAuth
        buildPhase: resources
      - path: ../shared/contract/http
        name: ContractHTTP
        buildPhase: resources
    dependencies:
      - target: ZenCompanion
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kjell.zencompanion.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  ZenCompanion:
    build:
      targets:
        ZenCompanion: all
        ShareExtension: all
        ZenCompanionTests: [test]
    test:
      targets:
        - ZenCompanionTests
